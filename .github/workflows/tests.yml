name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Tk and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
